groups:
- name: application-health
  interval: 30s
  rules:
  - alert: PodNotReady
    expr: kube_pod_status_phase{namespace="cloudmart-dev", phase!="Running"} == 1
    for: 2m
    labels:
      severity: critical
      category: availability
    annotations:
      summary: "Pod {{ $labels.pod }} is not ready"
      description: "Pod {{ $labels.pod }} is in {{ $labels.phase }} state for more than 2 minutes."

  - alert: HighErrorRate
    expr: |
      (
        sum(rate(http_requests_total{status=~"5..", namespace="cloudmart-dev"}[5m])) by (service)
        /
        sum(rate(http_requests_total{namespace="cloudmart-dev"}[5m])) by (service)
      ) > 0.05
    for: 2m
    labels:
      severity: critical
      category: performance
    annotations:
      summary: "High 5xx error rate on service {{ $labels.service }}"
      description: "Service {{ $labels.service }} has error rate {{ $value | humanizePercentage }}."

  - alert: ElevatedErrorRate
    expr: |
      (
        sum(rate(http_requests_total{status=~"5..", namespace="cloudmart-dev"}[5m])) by (service)
        /
        sum(rate(http_requests_total{namespace="cloudmart-dev"}[5m])) by (service)
      ) > 0.02
    for: 5m
    labels:
      severity: warning
      category: performance
    annotations:
      summary: "Elevated error rate on service {{ $labels.service }}"
      description: "Service {{ $labels.service }} has error rate {{ $value | humanizePercentage }}."

  - alert: SlowResponseTime
    expr: |
      histogram_quantile(0.95,
        sum(rate(http_request_duration_seconds_bucket{namespace="cloudmart-dev"}[5m])) by (le, service)
      ) > 0.5
    for: 3m
    labels:
      severity: warning
      category: performance
    annotations:
      summary: "Slow response time for {{ $labels.service }}"
      description: "Service {{ $labels.service }} p95 is {{ $value | humanizeDuration }}."

  - alert: VerySlowResponseTime
    expr: |
      histogram_quantile(0.95,
        sum(rate(http_request_duration_seconds_bucket{namespace="cloudmart-dev"}[5m])) by (le, service)
      ) > 2
    for: 2m
    labels:
      severity: critical
      category: performance
    annotations:
      summary: "Very slow response time for {{ $labels.service }}"
      description: "Service {{ $labels.service }} p95 is {{ $value | humanizeDuration }}."

- name: infrastructure-resources
  interval: 30s
  rules:
  
  # Pod CPU usage (works without container label)
  - alert: PodHighCPU
    expr: |
      sum(rate(container_cpu_usage_seconds_total{namespace="cloudmart-dev"}[5m])) by (pod, namespace)
      > 0.3
    for: 3m
    labels:
      severity: warning
      category: resources
    annotations:
      summary: "High CPU in pod {{ $labels.pod }}"
      description: "Pod {{ $labels.pod }} using {{ $value | humanize }} CPU cores (>0.3 cores for 3min)."

  # Pod memory usage
  - alert: PodHighMemory
    expr: |
      sum(container_memory_working_set_bytes{namespace="cloudmart-dev"}) by (pod, namespace)
      > 524288000
    for: 5m
    labels:
      severity: warning
      category: resources
    annotations:
      summary: "High memory in pod {{ $labels.pod }}"
      description: "Pod {{ $labels.pod }} using {{ $value | humanize1024 }}B memory (>500MB)."

  # Pod restart alert (guaranteed to work)
  - alert: PodFrequentRestarts
    expr: |
      increase(kube_pod_container_status_restarts_total{namespace="cloudmart-dev"}[15m]) > 2
    for: 1m
    labels:
      severity: warning
      category: stability
    annotations:
      summary: "Pod {{ $labels.pod }} restarting frequently"
      description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in 15 minutes."

  # Node-level alerts (always work)
  - alert: NodeHighCPU
    expr: |
      (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.80
    for: 3m
    labels:
      severity: warning
      category: resources
    annotations:
      summary: "High CPU on Minikube node"
      description: "Node CPU usage: {{ $value | humanizePercentage }} (threshold: 80%)."

  - alert: NodeHighMemory
    expr: |
      (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
    for: 5m
    labels:
      severity: warning
      category: resources
    annotations:
      summary: "High memory on Minikube node"
      description: "Node memory usage: {{ $value | humanizePercentage }} (threshold: 85%)."

  - alert: NodeHighDiskUsage
    expr: |
      (1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|fuse.lxcfs"})) > 0.80
    for: 10m
    labels:
      severity: warning
      category: resources
    annotations:
      summary: "High disk usage on Minikube node"
      description: "Node disk usage: {{ $value | humanizePercentage }} (threshold: 80%)."

- name: database-alerts
  interval: 30s
  rules:
  - alert: PostgreSQLPodDown
    expr: kube_pod_status_phase{namespace="cloudmart-dev", pod=~"postgres.*", phase!="Running"} == 1
    for: 1m
    labels:
      severity: critical
      category: database
    annotations:
      summary: "PostgreSQL pod is down"
      description: "PostgreSQL pod {{ $labels.pod }} is not running."

  - alert: PostgreSQLHighConnections
    expr: |
      sum(pg_stat_database_numbackends{namespace="cloudmart-dev"}) by (instance)
      /
      pg_settings_max_connections{namespace="cloudmart-dev"}
      > 0.8
    for: 5m
    labels:
      severity: warning
      category: database
    annotations:
      summary: "PostgreSQL high connections"
      description: "PostgreSQL {{ $labels.instance }} using {{ $value | humanizePercentage }} connections."

  - alert: RedisPodDown
    expr: kube_pod_status_phase{namespace="cloudmart-dev", pod=~"redis.*", phase!="Running"} == 1
    for: 1m
    labels:
      severity: critical
      category: cache
    annotations:
      summary: "Redis pod is down"
      description: "Redis pod {{ $labels.pod }} is not running."

  - alert: LowRedisCacheHitRate
    expr: |
      (
        rate(redis_keyspace_hits_total{namespace="cloudmart-dev"}[5m])
        /
        (
          rate(redis_keyspace_hits_total{namespace="cloudmart-dev"}[5m])
          +
          rate(redis_keyspace_misses_total{namespace="cloudmart-dev"}[5m])
        )
      ) < 0.7
    for: 10m
    labels:
      severity: warning
      category: cache
    annotations:
      summary: "Low Redis cache hit rate"
      description: "Cache hit rate is {{ $value | humanizePercentage }}."

- name: business-metrics
  interval: 1m
  rules:
  - alert: HighOrderFailureRate
    expr: |
      (
        sum(rate(orders_total{status="failed", namespace="cloudmart-dev"}[5m]))
        /
        sum(rate(orders_total{namespace="cloudmart-dev"}[5m]))
      ) > 0.1
    for: 3m
    labels:
      severity: critical
      category: business
    annotations:
      summary: "High order failure rate"
      description: "Order failure rate is {{ $value | humanizePercentage }}."

  - alert: LowProductInventory
    expr: product_stock_quantity{namespace="cloudmart-dev"} < 10
    for: 5m
    labels:
      severity: warning
      category: business
    annotations:
      summary: "Low inventory for {{ $labels.product_id }}"
      description: "Product {{ $labels.product_name }} has {{ $value }} items left."

  - alert: NoRecentOrders
    expr: rate(orders_total{namespace="cloudmart-dev"}[10m]) == 0
    for: 10m
    labels:
      severity: info
      category: business
    annotations:
      summary: "No recent orders"
      description: "No orders in last 10 minutes."

- name: alertmanager-health
  interval: 30s
  rules:
  - alert: AlertmanagerConfigReloadFailed
    expr: alertmanager_config_last_reload_successful{namespace="cloudmart-monitoring"} == 0
    for: 5m
    labels:
      severity: warning
      category: monitoring
    annotations:
      summary: "Alertmanager config reload failed"
      description: "Alertmanager {{ $labels.instance }} config reload failed."

  - alert: PrometheusScrapeFailure
    expr: up{job=~".*prometheus.*", namespace="cloudmart-monitoring"} == 0
    for: 5m
    labels:
      severity: critical
      category: monitoring
    annotations:
      summary: "Prometheus scrape failed"
      description: "Prometheus cannot scrape {{ $labels.job }}."

- name: test-alerts
  interval: 30s
  rules:
  - alert: MonitoringStackHealthy
    expr: up{namespace="cloudmart-monitoring"} == 1
    for: 1m
    labels:
      severity: info
      category: monitoring
    annotations:
      summary: "Monitoring is healthy"
      description: "This is a test alert - monitoring stack is operational."
